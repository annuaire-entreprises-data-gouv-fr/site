# This workflow will do a clean install of node dependencies, build the source code and run tests

name: 'Pre-merge checks'
permissions:
  contents: read

on:
  pull_request:
    branches: [main]

# Be extremely careful as the env variables defined here are accessible by all the actions of the workflow.
# For critical env variable, declare it within the action.
env:
  node-version: 22.22.2
  INSEE_GRAND_PUBLIC_MAIN_CLIENT_ID: ${{ secrets.INSEE_GRAND_PUBLIC_MAIN_CLIENT_ID }}
  INSEE_GRAND_PUBLIC_MAIN_CLIENT_SECRET: ${{ secrets.INSEE_GRAND_PUBLIC_MAIN_CLIENT_SECRET }}
  INSEE_GRAND_PUBLIC_MAIN_USERNAME: ${{ secrets.INSEE_GRAND_PUBLIC_MAIN_USERNAME }}
  INSEE_GRAND_PUBLIC_MAIN_PASSWORD: ${{ secrets.INSEE_GRAND_PUBLIC_MAIN_PASSWORD }}
  INSEE_GRAND_PUBLIC_FALLBACK_CLIENT_ID: ${{ secrets.INSEE_GRAND_PUBLIC_FALLBACK_CLIENT_ID }}
  INSEE_GRAND_PUBLIC_FALLBACK_CLIENT_SECRET: ${{ secrets.INSEE_GRAND_PUBLIC_FALLBACK_CLIENT_SECRET }}
  INSEE_GRAND_PUBLIC_FALLBACK_USERNAME: ${{ secrets.INSEE_GRAND_PUBLIC_FALLBACK_USERNAME }}
  INSEE_GRAND_PUBLIC_FALLBACK_PASSWORD: ${{ secrets.INSEE_GRAND_PUBLIC_FALLBACK_PASSWORD }}
  INSEE_EXPORT_SIRENE_MAIN_CLIENT_ID: ${{ secrets.INSEE_EXPORT_SIRENE_MAIN_CLIENT_ID }}
  INSEE_EXPORT_SIRENE_MAIN_CLIENT_SECRET: ${{ secrets.INSEE_EXPORT_SIRENE_MAIN_CLIENT_SECRET }}
  INSEE_EXPORT_SIRENE_MAIN_USERNAME: ${{ secrets.INSEE_EXPORT_SIRENE_MAIN_USERNAME }}
  INSEE_EXPORT_SIRENE_MAIN_PASSWORD: ${{ secrets.INSEE_EXPORT_SIRENE_MAIN_PASSWORD }}
  INSEE_EXPORT_SIRENE_FALLBACK_CLIENT_ID: ${{ secrets.INSEE_EXPORT_SIRENE_FALLBACK_CLIENT_ID }}
  INSEE_EXPORT_SIRENE_FALLBACK_CLIENT_SECRET: ${{ secrets.INSEE_EXPORT_SIRENE_FALLBACK_CLIENT_SECRET }}
  INSEE_EXPORT_SIRENE_FALLBACK_USERNAME: ${{ secrets.INSEE_EXPORT_SIRENE_FALLBACK_USERNAME }}
  INSEE_EXPORT_SIRENE_FALLBACK_PASSWORD: ${{ secrets.INSEE_EXPORT_SIRENE_FALLBACK_PASSWORD }}
  INSEE_ESPACE_AGENT_MAIN_CLIENT_ID: ${{ secrets.INSEE_ESPACE_AGENT_MAIN_CLIENT_ID }}
  INSEE_ESPACE_AGENT_MAIN_CLIENT_SECRET: ${{ secrets.INSEE_ESPACE_AGENT_MAIN_CLIENT_SECRET }}
  INSEE_ESPACE_AGENT_MAIN_USERNAME: ${{ secrets.INSEE_ESPACE_AGENT_MAIN_USERNAME }}
  INSEE_ESPACE_AGENT_MAIN_PASSWORD: ${{ secrets.INSEE_ESPACE_AGENT_MAIN_PASSWORD }}
  INSEE_ESPACE_AGENT_FALLBACK_CLIENT_ID: ${{ secrets.INSEE_ESPACE_AGENT_FALLBACK_CLIENT_ID }}
  INSEE_ESPACE_AGENT_FALLBACK_CLIENT_SECRET: ${{ secrets.INSEE_ESPACE_AGENT_FALLBACK_CLIENT_SECRET }}
  INSEE_ESPACE_AGENT_FALLBACK_USERNAME: ${{ secrets.INSEE_ESPACE_AGENT_FALLBACK_USERNAME }}
  INSEE_ESPACE_AGENT_FALLBACK_PASSWORD: ${{ secrets.INSEE_ESPACE_AGENT_FALLBACK_PASSWORD }}
  INDEXING_ENABLED: enabled
  MATOMO_ENABLED: disabled
  MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
  MATOMO_API_SITE_ID: ${{ secrets.MATOMO_API_SITE_ID }}
  MATOMO_TOKEN_AUTH: ${{ secrets.MATOMO_TOKEN_AUTH }}
  SESSION_PWD: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
  UPDOWN_IO_API_KEY: ${{ secrets.UPDOWN_IO_API_KEY }}

jobs:
  dependencies:
    name: 'Install dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
      - uses: ./.github/actions/install-dependencies
        name: Install and cache dependencies

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [dependencies]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
      - name: Load node_modules
        uses: ./.github/actions/load-dependencies
      - name: Run linter
        run: pnpm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [dependencies]
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
      - name: Load node_modules
        uses: ./.github/actions/load-dependencies

      - name: Build site
        run: pnpm run build
      - name: Smoke test production server
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 3000
        run: |
          pnpm start > /tmp/production-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/production-server.log' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/health > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done

          for route in health faq definitions; do
            curl --fail --silent --show-error "http://127.0.0.1:3000/$route" > /dev/null
          done
      - name: Cache site
        uses: actions/cache@v3
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [dependencies]
    env:
      API_RECHERCHE_ENTREPRISE_URL: https://recherche-entreprises.api.gouv.fr

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
      - name: Load node_modules
        uses: ./.github/actions/load-dependencies
      - name: Run unit tests
        run: |
          pnpm run test:unit

  testE2E:
    name: End2end tests
    runs-on: ubuntu-latest
    needs: [dependencies]
    env:
      VITE_END2END_MOCKING: enabled
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v6
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
      - name: Load node_modules
        uses: ./.github/actions/load-dependencies
      - name: Copy .env.test to .env
        run: cp .env.test .env
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests 🧪
        timeout-minutes: 20
        run: pnpm run test:end2end:run
      - name: Upload Playwright report 📊
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright test results 🎥
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore # 'warn' or 'error' are also available, defaults to `warn`

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: [dependencies]
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
      - name: Load node_modules
        uses: ./.github/actions/load-dependencies
      - name: Generate json data
        run: pnpm run compile:data
      - name: Run typescript check
        run: pnpm run typecheck
