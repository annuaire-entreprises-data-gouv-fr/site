name: 'Install node dependencies'
description: 'Install node dependencies and cache them for future use'

runs:
  using: 'composite'

  steps:
    - name: Enable pnpm
      shell: bash
      run: corepack enable pnpm

    - name: Cache node modules
      uses: actions/cache@v3
      id: restore-dependencies
      env:
        cache-name: cache-node-modules
      with:
        path: ./node_modules
        # No restore-keys: installing over a node_modules restored from an older
        # lockfile leaves stale packages behind (e.g. an old @sentry/core)
        key: ${{ runner.os }}-pnpm-node-modules-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prod=false --ignore-scripts
