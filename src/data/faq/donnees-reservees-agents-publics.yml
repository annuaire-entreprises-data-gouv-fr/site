title: Pourquoi certaines données sont-elles accessibles uniquement aux agents publics ?
seo:
  description: L’accès à certaines données de l’Annuaire des Entreprises est réservé aux agents publics dans le cadre des échanges de données entre administrations.
body: |
  L’accès aux données par l’espace « agents publics » de l’Annuaire des Entreprises s’inscrit dans le cadre du système d’échange de données entre administrations, prévu par les articles L. 114-8 et suivants du code des relations entre le public et l’administration (CRPA) et par l’article 1er de la loi n° 2016-1321 du 7 octobre 2016 pour une République numérique.

  Ce système a pour finalité exclusive de permettre à une administration d’accéder aux données strictement nécessaires détenues par une autre administration, afin de :

  1. Traiter une demande ou une déclaration présentée par le public ;
  2. Informer les personnes sur leurs droits à une prestation ou un avantage prévu par la loi ou un règlement ;
  3. Leur attribuer ces prestations ou avantages ;
  4. Accomplir leurs missions de service public.

  La DINUM, qui édite l’Annuaire des Entreprises, est habilitée à mettre ces données à disposition uniquement des administrations, et donc aux agents publics.

  Par conséquent, les entités privées ne peuvent pas accéder à ces données via cet espace. Les personnes privées doivent s’adresser aux guichets compétents pour toute demande d’accès, conformément aux procédures légales spécifiques.
